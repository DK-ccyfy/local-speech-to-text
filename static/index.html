<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本地语音识别系统 · Local Speech-to-Text</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <main class="container">
    <header>
      <h1>本地语音识别系统</h1>
      <p class="subtitle">中文 / 英文识别 · 本地开源模型 faster-whisper · CPU 推理 · 模型就绪后可离线运行</p>
    </header>

    <!-- 识别语言 -->
    <section class="card">
      <div class="card-title">识别语言</div>
      <div class="row">
        <label for="langSelect">当前模式：</label>
        <select id="langSelect">
          <option value="zh" selected>中文（普通话）</option>
          <option value="en">English</option>
          <option value="auto">自动检测（中英混合，实验性）</option>
        </select>
        <span id="modelStatus" class="muted"></span>
      </div>
    </section>

    <!-- 麦克风录音 -->
    <section class="card">
      <div class="card-title">麦克风录音</div>
      <div class="row">
        <button id="btnStart" class="btn primary">🎤 开始录音</button>
        <button id="btnStop" class="btn danger" disabled>⏹ 停止录音</button>
        <span id="micStatus" class="status-text">空闲</span>
        <span id="recordTimer" class="timer"></span>
      </div>
      <p class="hint">单次录音最长 60 秒，达到上限自动结束；录音过程中会每 3 秒刷新一次实时识别预览（加分功能），停止后给出最终结果。</p>
    </section>

    <!-- 文件上传 -->
    <section class="card">
      <div class="card-title">上传音频文件</div>
      <div class="row">
        <input type="file" id="uploadFile" accept=".wav,.webm,.mp3,audio/wav,audio/webm,audio/mpeg" />
        <button id="btnUpload" class="btn primary">⬆ 上传识别</button>
      </div>
      <p class="hint">支持 WAV / WebM / MP3，最大 10 MB。麦克风录音（WAV）与上传共用同一条识别接口。</p>
    </section>

    <!-- 识别结果 -->
    <section class="card">
      <div class="card-title">
        识别结果
        <span id="stateBadge" class="badge idle">空闲</span>
      </div>
      <textarea id="resultText" rows="5" readonly placeholder="识别文本将显示在这里…"></textarea>
      <div class="meta-row">
        <span>识别语言：<b id="metaLanguage">-</b></span>
        <span>音频时长：<b id="metaDuration">-</b></span>
        <span>处理耗时：<b id="metaProcessing">-</b></span>
      </div>
      <div class="row">
        <button id="btnCopy" class="btn" disabled>📋 复制文本</button>
        <span id="copyHint" class="muted"></span>
      </div>
    </section>

    <!-- 错误提示：顶部悬浮弹框 -->
    <div id="errorBox" class="error-toast" hidden role="alert">
      <div id="errorMessage"></div>
      <button id="btnRetry" class="btn" hidden>🔄 重试</button>
      <button id="btnCloseError" class="toast-close" aria-label="关闭提示" title="关闭">×</button>
    </div>

    <footer>
      <span class="muted">Local AI Speech-to-Text · B/S 架构 · 所有识别均在本地完成，不调用云端 API</span>
    </footer>
  </main>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
